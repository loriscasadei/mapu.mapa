<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapu Mapa — el mapa de las tierras patagónicas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="style.css">
<script>
/* Si un archivo de datos/ tiene un error de escritura, el navegador no lo puede leer.
   Esto anota en qué archivo y línea pasó, para mostrarlo arriba del panel. */
window.__errores=[];
addEventListener('error',e=>{
  const f=(e.filename||'').split('/').slice(-2).join('/');
  if(!/^datos\//.test(f))return;
  __errores.push([f+(e.lineno?', línea '+e.lineno:''),'Error de escritura: el archivo no se pudo leer. Revisá comas, comillas y llaves cerca de esa línea ('+e.message+').']);
});
</script>
</head>
<body data-page="mapa" class="map-page">
<header id="site-header" class="site-header"></header>
<div class="modebar">
  <div class="modesw" role="group" aria-label="Tipo de actividad">
    <button type="button" class="on" aria-pressed="true">Trekking</button>
    <span class="soon-wrap"><button type="button" aria-disabled="true" aria-describedby="soon-tip">Montañismo</button><span class="soon" id="soon-tip" role="tooltip">Coming soon</span></span>
  </div>
</div>
<div id="app">
  <div id="bar"><div class="filtros" id="filtros" role="group" aria-label="Filtros de senderos"></div><div class="tvstrip" id="tvlist" hidden></div></div>
  <div id="mapwrap">
    <div id="basemap" aria-hidden="true"></div>
    <svg id="map" data-z="1" role="img" aria-label="Mapa de senderos del Parque Nacional Nahuel Huapi, de Villa Traful al río Villegas"></svg>
    <div class="scale" id="scale"><span></span><i></i></div>
    <div class="zb"><button id="zin" aria-label="Acercar">+</button><button id="zout" aria-label="Alejar">−</button><button id="zre" aria-label="Ver todo" style="font-size:15px">todo</button></div>
    <div class="attr">Senderos, lagos y cumbres: © colaboradores de OpenStreetMap (noviembre de 2026). Relieve: SRTM.</div>
  </div>
  <aside id="panel" aria-live="polite"><div id="avisos" role="alert" hidden></div><div class="pin" id="pin"></div></aside>
</div>
<footer id="site-footer" class="site-footer"></footer>
<script src="auth.js"></script>
<script src="site.js"></script>
<!-- geometría generada: no editar -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="mapa-config.js"></script>
<script src="geo/geometria.js"></script>
<script src="geo/frontera.js"></script>
<!-- base de datos editable -->
<script src="datos/puntos.js"></script>
<script src="datos/tramos.js"></script>
<script src="datos/travesias.js"></script>
<!-- estado según el registro del Parque: generado por herramientas/actualizar-estado.mjs -->
<script src="datos/estado.js"></script>
<!-- lógica -->
<script src="app.js"></script>
</body>
</html>
